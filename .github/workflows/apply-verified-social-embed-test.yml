name: Apply Verified Social Embed Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-verified-social-embed-test.mjs'
      - '.github/workflows/apply-verified-social-embed-test.yml'

jobs:
  apply-verified-social-embed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified official social embed to draft only
        run: node --experimental-strip-types scripts/apply-verified-social-embed-test.mjs
