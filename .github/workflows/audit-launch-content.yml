name: Audit launch content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-launch-content.mjs'
      - '.github/workflows/audit-launch-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-launch-content:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit exact-five visuals, style structure and core brand coverage
        run: node scripts/audit-launch-content.mjs
      - name: Upload launch audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-content-audit
          path: launch-content-audit.json
          if-no-files-found: warn
          retention-days: 14
