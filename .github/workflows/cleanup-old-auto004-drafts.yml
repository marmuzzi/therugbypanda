name: Cleanup superseded AUTO-004 drafts

on:
  push:
    branches:
      - ops/cleanup-old-auto004-drafts
    paths:
      - scripts/cleanup-old-auto004-drafts.mjs
      - .github/workflows/cleanup-old-auto004-drafts.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      AUTO004_DRAFT_CUTOFF: 2026-08-24T20:24:00Z

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete only superseded generated production drafts
        run: node scripts/cleanup-old-auto004-drafts.mjs
