name: Current editorial source discovery

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run at both possible UTC equivalents of 06:30
    # Europe/Dublin and let the timezone guard execute only the matching one.
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Dublin discovery window
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DUBLIN_TIME="$(TZ=Europe/Dublin date +%H%M)"
          if [[ "$DUBLIN_TIME" == "0630" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC slot; Europe/Dublin time is $DUBLIN_TIME."
          fi
      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4
      - name: Setup Node
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover current registry sources
        if: steps.window.outputs.active == 'true'
        run: node scripts/discover-current-editorial-sources.mjs
      - name: Upload machine-readable discovery evidence
        if: steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: current-source-discovery-${{ github.run_id }}
          path: data/editorial-acquisition/current-source-discovery.json
          if-no-files-found: error
          retention-days: 14
