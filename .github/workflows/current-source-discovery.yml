name: Current editorial source discovery

on:
  workflow_dispatch:
  schedule:
    # One deterministic UTC slot. This is 06:30 in Dublin during Irish Summer
    # Time and 05:30 during winter, safely ahead of the 08:00 newsroom deadline.
    # A single slot avoids duplicate schedule events and guard-based false-success skips.
    - cron: "30 5 * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      AUTO004_DRAFT_CUTOFF: 2026-08-24T20:24:00Z
      RECENT_EDITORIAL_POSITIONS_PATH: data/editorial-acquisition/recent-editorial-positions.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # This repository intentionally has no npm lockfile. setup-node's npm cache
        # and npm ci both require one, so use a normal install on the ephemeral runner.
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify production secrets
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
        run: |
          if [ -z "$EDITORIAL_AUTOMATION_SECRET" ]; then
            echo "EDITORIAL_AUTOMATION_SECRET is not available to this workflow."
            exit 1
          fi
          if [ -z "$SANITY_API_TOKEN" ]; then
            echo "SANITY_API_TOKEN is not available to this workflow."
            exit 1
          fi
      - name: Discover current registry sources
        run: node scripts/discover-current-editorial-sources.mjs
      - name: Build corroborated acquisition evidence
        run: node scripts/build-current-editorial-acquisition-batch.mjs
      - name: Export recent production editorial positions
        run: node scripts/export-recent-editorial-positions.mjs
      - name: Delete superseded generated drafts
        run: node scripts/cleanup-old-auto004-drafts.mjs
      - name: Import exactly five fresh production-eligible drafts
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
          EDITORIAL_API_BASE_URL: https://therugbypanda.ie
          BATCH_PATH: data/editorial-acquisition/current-editorial-acquisition-batch.json
          REQUIRE_ALL_SELECTED_CREATED: "1"
        run: node scripts/import-editorial-acquisition-batch.mjs "$BATCH_PATH"
      - name: Send consolidated Zoho package only after successful fresh import
        if: success()
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
        run: |
          response_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $EDITORIAL_AUTOMATION_SECRET" \
            https://therugbypanda.ie/api/editorial/daily-package)
          cat "$response_file"
          echo
          if [ "$status" != "200" ]; then
            echo "Daily package delivery returned HTTP $status after fresh import."
            exit 1
          fi
          if ! grep -Eq '"status":"(sent|already-sent)"' "$response_file"; then
            echo "Daily package response did not confirm a sent package after fresh import."
            exit 1
          fi
      - name: Upload machine-readable discovery and acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-discovery-${{ github.run_id }}
          path: |
            data/editorial-acquisition/current-source-discovery.json
            data/editorial-acquisition/current-editorial-acquisition-batch.json
            data/editorial-acquisition/recent-editorial-positions.json
          if-no-files-found: warn
          retention-days: 14
