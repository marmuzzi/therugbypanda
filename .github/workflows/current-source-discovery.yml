name: Current editorial source discovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/recovery-trigger-2026-08-31"
  schedule:
    - cron: "30 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      AUTO004_DRAFT_CUTOFF: 2026-08-24T20:24:00Z
      RECENT_EDITORIAL_POSITIONS_PATH: data/editorial-acquisition/recent-editorial-positions.json
      DISCOVERY_MAX_AGE_HOURS: "36"
      IMAGE_CANDIDATE_TARGET: "3"
      IMAGE_PLAN_PATH: daily-article-image-plan-after-acquisition.json
      WIKIMEDIA_RESULTS_PER_QUERY: "20"
      IMAGE_MAX_QUERIES_PER_ARTICLE: "5"
      WIKIMEDIA_OUTPUT: data/editorial-images/daily-deficit-candidates.json
      WIKIMEDIA_CANDIDATE_FILE: data/editorial-images/daily-deficit-candidates.json
      WIKIMEDIA_REVIEW_FILE: data/editorial-images/daily-deficit-reviewed.json
      WIKIMEDIA_TRIAGE_REPORT: data/editorial-images/daily-deficit-triage.json
      WIKIMEDIA_MIN_APPROVED: "1"
      WIKIMEDIA_MAX_SCOPE_SHARE: "1.0"
      EDITORIAL_IMAGE_AUDIT_OUTPUT_DIR: artifacts/editorial-image-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify production secrets
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
        run: |
          if [ -z "$EDITORIAL_AUTOMATION_SECRET" ]; then
            echo "EDITORIAL_AUTOMATION_SECRET is not available to this workflow."
            exit 1
          fi
          if [ -z "$SANITY_API_TOKEN" ]; then
            echo "SANITY_API_TOKEN is not available to this workflow."
            exit 1
          fi
      - name: Check whether today's Zoho package already completed
        id: package_state
        run: node scripts/check-daily-package-complete.mjs
      - name: Discover current registry sources
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/discover-current-editorial-sources.mjs
      - name: Build corroborated acquisition evidence
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/build-current-editorial-acquisition-batch.mjs
      - name: Reject under-specified evidence before model spend
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/filter-current-acquisition-evidence.mjs
      - name: Export recent production editorial positions
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/export-recent-editorial-positions.mjs
      - name: Delete superseded generated drafts
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/cleanup-old-auto004-drafts.mjs
      - name: Import exactly five fresh production-eligible drafts
        if: steps.package_state.outputs.skip != 'true'
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
          EDITORIAL_API_BASE_URL: https://therugbypanda.ie
          BATCH_PATH: data/editorial-acquisition/current-editorial-acquisition-batch.json
          REQUIRE_ALL_SELECTED_CREATED: "1"
        run: node scripts/import-editorial-acquisition-batch.mjs "$BATCH_PATH"
      - name: Build current-package image candidate and deficit plan
        id: image_plan
        if: steps.package_state.outputs.skip != 'true'
        env:
          IMAGE_PLAN_PATH: daily-article-image-plan.json
        run: |
          node scripts/plan-daily-article-images.mjs
          node -e 'const p=require("./daily-article-image-plan.json"); console.log(`total_deficit=${p.totalDeficit}`)' >> "$GITHUB_OUTPUT"
      - name: Discover only current-package image deficits
        if: steps.package_state.outputs.skip != 'true' && steps.image_plan.outputs.total_deficit != '0'
        env:
          IMAGE_PLAN_PATH: daily-article-image-plan.json
        run: node scripts/discover-daily-article-image-deficits.mjs
      - name: Strict rights and relevance triage
        if: steps.package_state.outputs.skip != 'true' && steps.image_plan.outputs.total_deficit != '0'
        run: node scripts/triage-wikimedia-candidates.mjs
      - name: Import approved deficit images locally into Sanity
        if: steps.package_state.outputs.skip != 'true' && steps.image_plan.outputs.total_deficit != '0'
        run: node scripts/import-reviewed-wikimedia-images.mjs | tee data/editorial-images/daily-deficit-import.log
      - name: Reconcile publication-readiness metadata
        if: steps.package_state.outputs.skip != 'true' && steps.image_plan.outputs.total_deficit != '0'
        run: node scripts/reconcile-approved-editorial-readiness.mjs | tee data/editorial-images/daily-deficit-reconcile.log
      - name: Audit strict local publication readiness
        if: steps.package_state.outputs.skip != 'true' && steps.image_plan.outputs.total_deficit != '0'
        run: |
          npm run media:audit-readiness | tee data/editorial-images/daily-deficit-readiness.log
          cp artifacts/editorial-image-audit/editorial-image-readiness.json data/editorial-images/daily-deficit-readiness.json
      - name: Re-plan exact current package after acquisition
        if: steps.package_state.outputs.skip != 'true'
        env:
          IMAGE_PLAN_PATH: daily-article-image-plan.json
        run: |
          cp daily-article-image-plan.json daily-article-image-plan-before-acquisition.json
          node scripts/plan-daily-article-images.mjs
          cp daily-article-image-plan.json daily-article-image-plan-after-acquisition.json
      - name: Assign and verify relevant hero and inline images on exact five
        if: steps.package_state.outputs.skip != 'true'
        env:
          IMAGE_PLAN_PATH: daily-article-image-plan-after-acquisition.json
        run: node scripts/enrich-current-morning-visuals.mjs
      - name: Send consolidated Zoho package only after fresh import and image verification
        if: success() && steps.package_state.outputs.skip != 'true'
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
        run: |
          response_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $EDITORIAL_AUTOMATION_SECRET" \
            https://therugbypanda.ie/api/editorial/daily-package)
          cat "$response_file"
          echo
          if [ "$status" != "200" ]; then
            echo "Daily package delivery returned HTTP $status after image-verified fresh import."
            exit 1
          fi
          if ! grep -Eq '"status":"(sent|already-sent)"' "$response_file"; then
            echo "Daily package response did not confirm a sent package after image verification."
            exit 1
          fi
      - name: Upload machine-readable newsroom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-discovery-${{ github.run_id }}
          path: |
            data/editorial-acquisition/current-source-discovery.json
            data/editorial-acquisition/current-editorial-acquisition-batch.json
            data/editorial-acquisition/current-evidence-sufficiency.json
            data/editorial-acquisition/recent-editorial-positions.json
            daily-article-image-plan*.json
            visual-enrichment-summary.json
            data/editorial-images/daily-deficit-*.json
            data/editorial-images/daily-deficit-*.log
          if-no-files-found: warn
          retention-days: 14
