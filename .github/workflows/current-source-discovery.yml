name: Current editorial source discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/recovery-trigger-2026-08-31"
      - ".github/current-source-production-trigger"
  schedule:
    # GitHub cron is UTC. 04:30 UTC is 05:30 Dublin during Irish summer time.
    # 05:30 UTC is the serialized safety retry and becomes a no-op after five accepted individual deliveries.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"

concurrency:
  group: current-editorial-source-discovery-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      RECENT_EDITORIAL_POSITIONS_PATH: data/editorial-acquisition/recent-editorial-positions.json
      DISCOVERY_MAX_AGE_HOURS: "36"
      IRISH_DISCOVERY_MAX_AGE_HOURS: "72"
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify story freshness including progressive match phases
        run: node --test --experimental-strip-types lib/editorial/StoryFreshness.test.ts
      - name: Verify production secrets
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
        run: |
          test -n "$EDITORIAL_AUTOMATION_SECRET"
          test -n "$SANITY_API_TOKEN"
      - name: Sanitize historical eligibility and check daily completion
        id: package_state
        run: node scripts/check-daily-package-complete.mjs
      - name: Evict materially duplicate retained current-day drafts
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/evict-current-source-duplicate-drafts.mjs
      - name: Discover standard and Irish-first current reserve
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/discover-current-editorial-sources.mjs
      - name: Build corroborated evidence
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/build-current-editorial-acquisition-batch.mjs
      - name: Reject weak evidence before model spend
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/filter-current-acquisition-evidence.mjs
      - name: Align match-detail evidence with generation API before spend
        if: steps.package_state.outputs.skip != 'true'
        env:
          BATCH_PATH: data/editorial-acquisition/current-editorial-acquisition-batch.json
        run: node scripts/filter-preai-match-detail-parity.mjs
      - name: Export recent production positions before package selection
        if: steps.package_state.outputs.skip != 'true'
        run: node scripts/export-recent-editorial-positions.mjs
      - name: Reject repeated production-history positions before diversity
        if: steps.package_state.outputs.skip != 'true'
        env:
          BATCH_PATH: data/editorial-acquisition/current-editorial-acquisition-batch.json
        run: node scripts/filter-current-production-history-freshness.mjs
      - name: Enforce Ireland-first and same-package diversity before spend
        if: steps.package_state.outputs.skip != 'true'
        env:
          BATCH_PATH: data/editorial-acquisition/current-editorial-acquisition-batch.json
          MAX_PACKAGE_MATCHUP_STORIES: "3"
          MAX_PACKAGE_TEAM_STORIES: "3"
        run: node scripts/enforce-current-package-diversity.mjs
      - name: Assign exactly one paid candidate to each missing slot
        if: steps.package_state.outputs.skip != 'true'
        env:
          BATCH_PATH: data/editorial-acquisition/current-editorial-acquisition-batch.json
        run: node scripts/prepare-slot-budget-batch.mjs
      - name: Generate each selected missing slot once
        if: steps.package_state.outputs.skip != 'true'
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
          EDITORIAL_API_BASE_URL: https://therugbypanda.ie
          BATCH_PATH: data/editorial-acquisition/current-editorial-acquisition-batch.json
          REQUIRE_ALL_SELECTED_CREATED: "0"
          MAX_REPLACEMENT_CANDIDATES: "0"
          EDITORIAL_GENERATION_CONCURRENCY: "1"
        run: node scripts/import-editorial-acquisition-batch.mjs "$BATCH_PATH"
      - name: Upload machine-readable newsroom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-discovery-${{ github.run_id }}
          path: |
            data/editorial-acquisition/current-source-discovery.json
            data/editorial-acquisition/current-editorial-acquisition-batch.json
            data/editorial-acquisition/current-evidence-sufficiency.json
            data/editorial-acquisition/preai-match-detail-parity.json
            data/editorial-acquisition/current-production-history-freshness.json
            data/editorial-acquisition/recent-editorial-positions.json
          if-no-files-found: warn
          retention-days: 14
