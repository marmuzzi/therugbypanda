name: Discover Wikimedia editorial images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-wikimedia-editorial-images.yml'
      - 'scripts/discover-wikimedia-editorial-images.mjs'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover diverse rights-aware candidates
        env:
          WIKIMEDIA_RESULTS_PER_QUERY: '30'
          WIKIMEDIA_OUTPUT: data/editorial-images/wikimedia-candidates.json
        run: npm run media:discover-wikimedia
      - name: Publish measured candidate set artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikimedia-editorial-candidates
          path: data/editorial-images/wikimedia-candidates.json
          if-no-files-found: error
          retention-days: 7
      - name: Persist measured candidate set for autonomous review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial-images/wikimedia-candidates.json
          if git diff --cached --quiet; then
            echo "Candidate set unchanged; nothing to persist."
            exit 0
          fi
          git commit -m "Media: refresh measured Wikimedia candidates [skip ci]"
          git push --force origin HEAD:refs/heads/media/wikimedia-discovery-output
