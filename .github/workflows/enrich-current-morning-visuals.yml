name: Enrich Current Morning Visuals

on:
  workflow_dispatch:

jobs:
  enrich-current-morning-visuals:
    name: Add and verify evidence-backed cards and inline images
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich and verify current five-article package
        run: node --experimental-strip-types scripts/enrich-current-morning-visuals.mjs
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: visual-enrichment-summary
          path: visual-enrichment-summary.json
          if-no-files-found: error
          retention-days: 7
