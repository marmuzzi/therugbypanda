name: Import editorial acquisition batch

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: Repository path to the reviewed acquisition batch JSON
        required: true
        default: data/editorial-acquisition/auto004-2026-08-24-fresh.json
  schedule:
    - cron: '30 6 * * *'
      timezone: Europe/Dublin
  push:
    branches:
      - main
    paths:
      - .github/auto004-import-trigger.txt

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      AUTO004_DRAFT_CUTOFF: 2026-08-24T20:24:00Z
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production secrets
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
        run: |
          if [ -z "$EDITORIAL_AUTOMATION_SECRET" ]; then
            echo "EDITORIAL_AUTOMATION_SECRET is not available to this workflow."
            exit 1
          fi
          if [ -z "$SANITY_API_TOKEN" ]; then
            echo "SANITY_API_TOKEN is not available to this workflow."
            exit 1
          fi

      - name: Resolve acquisition batch
        id: batch
        env:
          DISPATCH_BATCH_PATH: ${{ inputs.batch_path }}
        run: |
          batch_path="$DISPATCH_BATCH_PATH"
          reuse_ids=""
          if [ -f .github/auto004-import-trigger.txt ]; then
            if [ -z "$batch_path" ]; then
              batch_path=$(sed -n 's/^Batch:[[:space:]]*//p' .github/auto004-import-trigger.txt | head -n 1)
            fi
            reuse_ids=$(sed -n 's/^Reuse:[[:space:]]*//p' .github/auto004-import-trigger.txt | head -n 1)
          fi
          batch_path="${batch_path:-data/editorial-acquisition/auto004-2026-08-24-fresh.json}"
          if [ ! -f "$batch_path" ]; then
            echo "Resolved batch does not exist: $batch_path"
            exit 1
          fi
          echo "Using acquisition batch: $batch_path"
          if [ -n "$reuse_ids" ]; then
            echo "Reusing accepted candidate IDs: $reuse_ids"
          fi
          echo "batch_path=$batch_path" >> "$GITHUB_OUTPUT"
          echo "reuse_ids=$reuse_ids" >> "$GITHUB_OUTPUT"

      - name: Delete superseded generated drafts
        run: node scripts/cleanup-old-auto004-drafts.mjs

      - name: Import production-eligible drafts
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
          EDITORIAL_API_BASE_URL: https://therugbypanda.ie
          BATCH_PATH: ${{ steps.batch.outputs.batch_path }}
          REUSE_EXISTING_IDS: ${{ steps.batch.outputs.reuse_ids }}
        run: node scripts/import-editorial-acquisition-batch.mjs "$BATCH_PATH"
