name: Import editorial acquisition batch

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: Repository path to the reviewed acquisition batch JSON
        required: true
        default: data/editorial-acquisition/auto004-2026-08-18-enriched.json
  push:
    branches:
      - main
    paths:
      - .github/auto004-import-trigger.txt

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify editorial automation secret
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
        run: |
          if [ -z "$EDITORIAL_AUTOMATION_SECRET" ]; then
            echo "EDITORIAL_AUTOMATION_SECRET is not available to this workflow."
            exit 1
          fi

      - name: Import production-eligible drafts
        env:
          EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
          EDITORIAL_API_BASE_URL: https://therugbypanda.ie
          BATCH_PATH: ${{ inputs.batch_path }}
        run: node scripts/import-editorial-acquisition-batch.mjs "${BATCH_PATH:-data/editorial-acquisition/auto004-2026-08-18-enriched.json}"
