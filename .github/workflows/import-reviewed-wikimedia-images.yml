name: Import reviewed Wikimedia images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/editorial-images/wikimedia-reviewed.json'

permissions:
  contents: read

jobs:
  import:
    name: Import assistant-approved Wikimedia images into Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      WIKIMEDIA_REVIEW_FILE: data/editorial-images/wikimedia-reviewed.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Import reviewed Wikimedia assets locally into Sanity
        run: npm run media:import-reviewed-wikimedia
