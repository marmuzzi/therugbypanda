name: Import Wikimedia international team gap wave
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-wikimedia-international-team-gap.yml'
      - 'scripts/discover-wikimedia-international-teams.mjs'
permissions:
  contents: write
concurrency:
  group: wikimedia-international-team-gap-import
  cancel-in-progress: false
jobs:
  discover-triage-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      WIKIMEDIA_CANDIDATE_FILE: data/editorial-images/wikimedia-international-team-candidates.json
      WIKIMEDIA_REVIEW_FILE: data/editorial-images/wikimedia-international-team-reviewed.json
      WIKIMEDIA_TRIAGE_REPORT: data/editorial-images/wikimedia-international-team-triage.json
      EDITORIAL_IMAGE_AUDIT_OUTPUT_DIR: artifacts/editorial-image-audit
      WIKIMEDIA_MIN_APPROVED: '12'
      WIKIMEDIA_MAX_SCOPE_SHARE: '0.18'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Discover current international team images
        env:
          WIKIMEDIA_OUTPUT: data/editorial-images/wikimedia-international-team-candidates.json
        run: node scripts/discover-wikimedia-international-teams.mjs
      - name: Strict assistant triage
        run: node scripts/triage-wikimedia-candidates.mjs
      - name: Import approved images locally into Sanity
        run: node scripts/import-reviewed-wikimedia-images.mjs | tee data/editorial-images/wikimedia-international-team-import.log
      - name: Reconcile approved publication metadata
        run: node scripts/reconcile-approved-editorial-readiness.mjs | tee data/editorial-images/wikimedia-international-team-reconcile.log
      - name: Audit publication readiness
        run: |
          npm run media:audit-readiness | tee data/editorial-images/wikimedia-international-team-readiness.log
          cp artifacts/editorial-image-audit/editorial-image-readiness.json data/editorial-images/wikimedia-international-team-readiness.json
      - name: Persist measured evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial-images/wikimedia-international-team-*.json data/editorial-images/wikimedia-international-team-*.log || true
          if git diff --cached --quiet; then echo "No evidence changed."; exit 0; fi
          git commit -m "Media: persist international team gap evidence [skip ci]"
          git push --force origin HEAD:refs/heads/media/international-team-gap-report

