name: Localize approved Brand Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-approved-brand-assets.yml'
      - 'scripts/localize-approved-brand-assets.mjs'

permissions:
  contents: write

concurrency:
  group: approved-brand-asset-localization
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      BRAND_ASSET_AUDIT_OUTPUT: data/brand-assets/approved-brand-localization-audit-after.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Localize strong approved logo sources
        continue-on-error: true
        run: node scripts/localize-approved-brand-assets.mjs | tee data/brand-assets/approved-brand-localization-run.json
      - name: Re-audit approved Brand Assets
        run: node scripts/audit-approved-brand-assets.mjs
      - name: Persist localization evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brand-assets/approved-brand-localization-run.json data/brand-assets/approved-brand-localization-audit-after.json || true
          if git diff --cached --quiet; then
            echo "No localization evidence changed."
            exit 0
          fi
          git commit -m "Media: persist Brand Asset localization evidence [skip ci]"
          git push --force origin HEAD:refs/heads/media/brand-asset-localization-report
