name: Localize approved Wikimedia Editorial Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/localize-approved-wikimedia-editorial-images.mjs'
      - 'scripts/audit-local-editorial-image-floor.mjs'
      - '.github/workflows/localize-approved-wikimedia-editorial-images.yml'

concurrency:
  group: localize-approved-wikimedia-editorial-images
  cancel-in-progress: false

jobs:
  localize-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      EDITORIAL_IMAGE_AUDIT_OUTPUT_DIR: artifacts/editorial-image-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Localize already-approved Wikimedia records
        run: node scripts/localize-approved-wikimedia-editorial-images.mjs
      - name: Run existing metadata readiness audit
        run: npm run media:audit-readiness
      - name: Run strict local-asset floor audit
        run: node scripts/audit-local-editorial-image-floor.mjs
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-localization-editorial-image-audit
          path: artifacts/editorial-image-audit
          if-no-files-found: error
          retention-days: 30
