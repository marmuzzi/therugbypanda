name: Morning editorial SLA watchdog

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled runs can be delayed under load. Start well before the 08:00 Europe/Dublin SLA
    # and retry hourly. The downstream workflow is serialized and its exact-package gate no-ops after success.
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
    - cron: "17 3 * * *"
    - cron: "17 4 * * *"
    - cron: "17 5 * * *"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-editorial-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current editorial source discovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/current-source-discovery.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched current-source-discovery.yml for main."
