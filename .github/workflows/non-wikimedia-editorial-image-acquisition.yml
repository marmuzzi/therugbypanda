name: Non-Wikimedia editorial image acquisition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/non-wikimedia-editorial-image-acquisition.yml'
      - 'scripts/import-pexels-rugby-library.mjs'
  workflow_dispatch:

concurrency:
  group: non-wikimedia-editorial-image-acquisition-production
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: '2025-01-01'
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
      PEXELS_IMPORT_LIMIT: '1500'
      PEXELS_PER_QUERY: '80'
      PEXELS_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Pexels and Sanity credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PEXELS_API_KEY:-}" || { echo 'PEXELS_API_KEY missing'; exit 2; }
          test -n "${SANITY_API_TOKEN:-}" || { echo 'SANITY_API_TOKEN missing'; exit 2; }
          echo 'PEXELS_API_KEY configured'
          echo 'SANITY_API_TOKEN configured'
          echo 'OpenAI is intentionally unused by this workflow.'
      - name: Import safe generic rugby images from Pexels
        run: node scripts/import-pexels-rugby-library.mjs
      - name: Reconcile approved editorial readiness
        run: node scripts/reconcile-approved-editorial-readiness.mjs
      - name: Audit editorial image library
        run: npm run media:audit-readiness
