name: Plan daily article images

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Import editorial acquisition batch
    types:
      - completed

permissions:
  contents: read

jobs:
  plan-daily-images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      IMAGE_CANDIDATE_TARGET: 3
      IMAGE_ARTICLE_LOOKBACK_HOURS: 18
    steps:
      - name: Checkout main after successful morning generation
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build fail-closed local candidate and acquisition-deficit plan
        run: node scripts/plan-daily-article-images.mjs

      - name: Upload daily MEDIA-011 evidence
        uses: actions/upload-artifact@v4
        with:
          name: daily-article-image-plan
          path: daily-article-image-plan.json
          if-no-files-found: error
          retention-days: 14
