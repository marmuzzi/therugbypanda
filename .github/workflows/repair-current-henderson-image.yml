name: Repair Current Henderson Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/repair-current-henderson-image.mjs
      - .github/workflows/repair-current-henderson-image.yml

jobs:
  repair-current-henderson-image:
    name: Repair current Henderson featured image safely
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair and verify current Henderson image
        run: node scripts/repair-current-henderson-image.mjs
