name: Repair current package visuals

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-current-package-visuals.mjs'
      - '.github/workflows/repair-current-package-visuals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-current-package-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: hvg4b508
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair exact-five visual associations without GPT or email
        run: node scripts/repair-current-package-visuals.mjs
      - name: Upload production readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-package-visual-repair
          path: current-package-visual-repair.json
          if-no-files-found: warn
          retention-days: 14
