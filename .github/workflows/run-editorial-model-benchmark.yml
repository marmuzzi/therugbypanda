name: Run controlled editorial model benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/editorial-model-benchmark-trigger.txt'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
      BASE_URL: https://therugbypanda.ie
      MODEL: gpt-5-mini
    steps:
      - name: Verify benchmark authorization
        run: |
          test -n "$EDITORIAL_AUTOMATION_SECRET" || { echo "Missing EDITORIAL_AUTOMATION_SECRET"; exit 1; }

      - name: Wait for controlled benchmark route
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl --silent --show-error --max-time 10 "$BASE_URL/api/internal/editorial-benchmark" || true)
            if printf '%s' "$body" | grep -q '"benchmarkMode":"controlled-canonical-package"'; then
              echo "Controlled benchmark route is live."
              exit 0
            fi
            echo "Waiting for benchmark route ($attempt/30)."
            sleep 10
          done
          echo "Benchmark route did not become ready."
          exit 1

      - name: Benchmark canonical five-story package
        run: |
          mkdir -p artifacts/editorial-model-benchmark
          consecutive_failures=0
          attempted=0
          passed=0
          for candidate in 0 1 2 3 4; do
            attempted=$((attempted + 1))
            output="artifacts/editorial-model-benchmark/candidate-${candidate}.json"
            http=$(curl --silent --show-error --max-time 230 \
              --output "$output" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $EDITORIAL_AUTOMATION_SECRET" \
              --header 'Content-Type: application/json' \
              --data "{\"model\":\"$MODEL\",\"candidate\":$candidate}" \
              "$BASE_URL/api/internal/editorial-benchmark" || true)
            cat "$output" || true
            echo
            if [ "$http" = "200" ] && grep -q '"status":"benchmark-passed"' "$output"; then
              passed=$((passed + 1))
              consecutive_failures=0
            else
              consecutive_failures=$((consecutive_failures + 1))
              echo "Candidate $candidate failed with HTTP $http."
            fi
            if [ "$consecutive_failures" -ge 2 ]; then
              echo "Stopping after two consecutive failures to protect prepaid balance."
              break
            fi
          done
          printf '{"model":"%s","attempted":%d,"passed":%d,"failed":%d}\n' "$MODEL" "$attempted" "$passed" "$((attempted-passed))" | tee artifacts/editorial-model-benchmark/summary.json

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: editorial-model-benchmark-gpt5-mini
          path: artifacts/editorial-model-benchmark
          if-no-files-found: error
          retention-days: 30
