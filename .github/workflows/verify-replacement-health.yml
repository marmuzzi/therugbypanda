name: Verify editorial replacement health

on:
  push:
    branches: [main]
    paths:
      - '.github/replacement-health-trigger.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      EDITORIAL_AUTOMATION_SECRET: ${{ secrets.EDITORIAL_AUTOMATION_SECRET }}
      BASE_URL: https://therugbypanda.ie
    steps:
      - name: Wait for protected health route
        run: |
          for attempt in $(seq 1 24); do
            output=$(curl --silent --show-error --max-time 10 \
              --header "Authorization: Bearer $EDITORIAL_AUTOMATION_SECRET" \
              "$BASE_URL/api/internal/replacement-health" || true)
            echo "$output"
            if printf '%s' "$output" | grep -q '"status":"ready"'; then
              printf '%s' "$output" > replacement-health.json
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Report replacement readiness
        run: |
          cat replacement-health.json
          if grep -q '"replacementWebhookConfigured":true' replacement-health.json; then
            echo "Replacement webhook is configured in production."
          else
            echo "Replacement webhook is NOT configured in production."
          fi
